name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# gh release create writes to the repo; read is the default.
permissions:
  contents: write

jobs:
  build:
    # Only the owner's pushes, tags and PRs run CI; anyone else's PR or fork is skipped.
    if: github.actor == 'Bidyut-Kr-Das'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP 9.3.1 needs 17 or newer; 21 matches the Android Studio JBR.
          cache: gradle

      # gradlew may be committed without its executable bit from Windows.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Tests run on every trigger, so a tag can never publish a build that does not pass them.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      # Only tags build the signed release. The keystore lives in repo secrets, base64-encoded,
      # and is written to the runner's temp dir, never into the workspace.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAYEROWL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAYEROWL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAYEROWL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not set"; exit 1; }
          export PLAYEROWL_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$PLAYEROWL_KEYSTORE"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "PlayerOwl-${GITHUB_REF_NAME}.apk"

      # gh is preinstalled on the runner, so no third-party release action is needed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "PlayerOwl-${GITHUB_REF_NAME}.apk" --generate-notes
