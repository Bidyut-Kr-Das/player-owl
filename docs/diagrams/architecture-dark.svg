      #architecture-dark-root { color: #F2EFEA; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-dark-root .n { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #F2EFEA; }
      #architecture-dark-root .s { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #C8C2BA; }
      #architecture-dark-root .l { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #A39C94; letter-spacing: 0.06em; }
