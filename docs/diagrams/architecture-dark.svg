<title id="architecture-dark-title">Player Owl architecture</title>
<desc id="architecture-dark-desc">PlayerActivity coordinates Gestures, PlayerMath, Resume, ExoPlayer and the audio and window controls; LibraryActivity lists videos from MediaStore and hands a video URI to PlayerActivity.</desc>
