<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-light-title architecture-light-desc" id="architecture-light-root">
<title id="architecture-light-title">Quiet Player architecture</title>
<desc id="architecture-light-desc">PlayerActivity coordinates Gestures, PlayerMath, ExoPlayer and the audio and window controls; LibraryActivity lists videos from MediaStore and hands a video URI to PlayerActivity.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-light-root { --paper: #FBF9F7; --ink: #1A1918; }
      #architecture-light-root { color: #1A1918; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #architecture-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-light-root .n { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1A1918; }
      #architecture-light-root .s { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #4E4A45; }
      #architecture-light-root .l { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #6B655F; letter-spacing: 0.06em; }
      #architecture-light-root .z { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 500; fill: #6B655F; letter-spacing: 0.14em; }
      #architecture-light-root .c { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 15px; fill: #4E4A45; }</style>
